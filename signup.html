<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Smart Kissan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#16a34a', primaryDark: '#15803d', darkGreen: '#14532d', earth: '#d97706', lightEarth: '#fef3c7', darkBg: '#0f172a' } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-primary selection:text-white min-h-screen flex items-center justify-center relative py-10">

    <!-- Animated Background -->
    <div class="fixed inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1605000797499-95a51c5269ae?w=1600" alt="Farm Field" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-darkGreen/80 backdrop-blur-[2px]"></div>
    </div>

    <!-- Signup Container -->
    <div class="relative z-10 w-full max-w-xl px-4">
        <div class="glass p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/20">
            
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-4">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-earth flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-seedling text-2xl"></i>
                    </div>
                </a>
                <h2 class="text-3xl font-bold text-white mb-2">Create an Account</h2>
                <p class="text-green-100/80">Join the smartest farming network in Pakistan</p>
            </div>

            <form id="signup-form" class="space-y-5">
                <!-- Role Selection -->
                <div>
                    <label class="block text-sm font-medium text-white mb-2">I am a...</label>
                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer relative">
                            <input type="radio" name="role" value="Farmer" class="peer sr-only" checked>
                            <div class="text-center p-3 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-primary/40 peer-checked:border-primary transition text-white">
                                <i class="fa-solid fa-tractor text-xl mb-1 block"></i>
                                <span class="text-xs font-semibold">Farmer</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="radio" name="role" value="Expert" class="peer sr-only">
                            <div class="text-center p-3 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-primary/40 peer-checked:border-primary transition text-white">
                                <i class="fa-solid fa-user-tie text-xl mb-1 block"></i>
                                <span class="text-xs font-semibold">Expert</span>
                            </div>
                        </label>
                        <label class="cursor-pointer relative">
                            <input type="radio" name="role" value="Buyer" class="peer sr-only">
                            <div class="text-center p-3 rounded-xl border border-white/20 bg-white/5 peer-checked:bg-primary/40 peer-checked:border-primary transition text-white">
                                <i class="fa-solid fa-store text-xl mb-1 block"></i>
                                <span class="text-xs font-semibold">Buyer</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Error Message Banner -->
                <div id="error-message" class="hidden bg-red-500/20 border border-red-500/50 p-4 rounded-xl text-red-100 text-sm text-center"></div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">Full Name</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50"><i class="fa-solid fa-user"></i></div>
                            <input type="text" id="fullName" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary outline-none" placeholder="Ali Khan" required>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-white mb-1">Phone Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50"><i class="fa-solid fa-phone"></i></div>
                            <input type="tel" id="phone" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary outline-none" placeholder="+92 300 0000000" required>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-white mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50"><i class="fa-solid fa-envelope"></i></div>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary outline-none" placeholder="you@example.com" required>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-white mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50"><i class="fa-solid fa-lock"></i></div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary outline-none" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- OTP Verification UI (Mock) -->
                <div class="bg-primary/10 border border-primary/30 p-4 rounded-xl hidden" id="otp-section">
                    <p class="text-sm text-white mb-3 text-center">Enter the 4-digit code sent to your phone</p>
                    <div class="flex justify-center gap-2">
                        <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-white/20 border border-white/30 rounded-lg text-white outline-none focus:ring-2 focus:ring-primary">
                        <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-white/20 border border-white/30 rounded-lg text-white outline-none focus:ring-2 focus:ring-primary">
                        <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-white/20 border border-white/30 rounded-lg text-white outline-none focus:ring-2 focus:ring-primary">
                        <input type="text" maxlength="1" class="w-12 h-12 text-center text-xl font-bold bg-white/20 border border-white/30 rounded-lg text-white outline-none focus:ring-2 focus:ring-primary">
                    </div>
                </div>

                <div class="flex items-start">
                    <input id="terms" type="checkbox" class="mt-1 w-4 h-4 text-primary bg-white/10 border-white/20 rounded focus:ring-primary focus:ring-2 accent-primary" required>
                    <label for="terms" class="ml-2 text-sm text-white/80">I agree to the <a href="#" class="text-primary hover:underline">Terms of Service</a> and <a href="#" class="text-primary hover:underline">Privacy Policy</a>.</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform hover:-translate-y-0.5 mt-2 text-lg flex items-center justify-center gap-2">
                    Create Account
                </button>
            </form>

            <p class="mt-8 text-center text-sm text-white/80">
                Already have an account? <a href="login.html" class="text-primary hover:text-green-300 font-bold hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <!-- API Client & Page Logic -->
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const errBanner = document.getElementById('error-message');
            
            // Collect Form Data
            const selectedRole = document.querySelector('input[name="role"]:checked').value;
            const fullName = document.getElementById('fullName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Set UI to loading state
            errBanner.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Creating Account...';
            
            try {
                const response = await API.request('POST', '/auth/register', {
                    fullName,
                    email,
                    password,
                    phone,
                    role: selectedRole
                });
                
                // Show Success & Redirect
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Redirecting...';
                setTimeout(() => {
                    window.location.href = 'dashboard/index.html';
                }, 800);
                
            } catch (err) {
                // Show Error
                errBanner.textContent = err.message || 'Registration failed. Please try again.';
                errBanner.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
