<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Kissan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#16a34a', primaryDark: '#15803d', darkGreen: '#14532d', earth: '#d97706', lightEarth: '#fef3c7', darkBg: '#0f172a' } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-primary selection:text-white h-screen overflow-hidden flex items-center justify-center relative">

    <!-- Animated Background -->
    <div class="absolute inset-0 z-0">
        <img src="https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1600" alt="Farm" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-darkGreen/70 backdrop-blur-[2px]"></div>
        
        <!-- Floating Elements -->
        <div class="absolute top-20 left-20 w-32 h-32 bg-primary rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-float" style="animation-duration: 8s;"></div>
        <div class="absolute bottom-20 right-20 w-40 h-40 bg-earth rounded-full mix-blend-multiply filter blur-2xl opacity-50 animate-float" style="animation-duration: 10s; animation-delay: 2s;"></div>
    </div>

    <!-- Login Container -->
    <div class="relative z-10 w-full max-w-md px-4">
        <div class="glass p-8 sm:p-10 rounded-3xl shadow-2xl border border-white/20">
            
            <div class="text-center mb-8">
                <a href="index.html" class="inline-flex items-center gap-2 mb-6">
                    <div class="w-12 h-12 rounded-full bg-gradient-to-br from-primary to-earth flex items-center justify-center text-white shadow-lg">
                        <i class="fa-solid fa-leaf text-2xl"></i>
                    </div>
                </a>
                <h2 class="text-3xl font-bold text-white mb-2">Welcome Back</h2>
                <p class="text-green-100/80">Log in to manage your smart farm</p>
            </div>

            <form id="login-form" class="space-y-5">
                <!-- Error Message Banner -->
                <div id="error-message" class="hidden bg-red-500/20 border border-red-500/50 p-4 rounded-xl text-red-100 text-sm text-center"></div>

                <div>
                    <label class="block text-sm font-medium text-white mb-1">Email Address</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                        <input type="email" id="email" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition" placeholder="you@example.com" required>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label class="block text-sm font-medium text-white">Password</label>
                        <a href="#" class="text-xs text-primary hover:text-green-300 font-semibold transition-colors">Forgot Password?</a>
                    </div>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-white/50">
                            <i class="fa-solid fa-lock"></i>
                        </div>
                        <input type="password" id="password" class="w-full pl-10 pr-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/40 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="flex items-center">
                    <input id="remember" type="checkbox" class="w-4 h-4 text-primary bg-white/10 border-white/20 rounded focus:ring-primary focus:ring-2 accent-primary">
                    <label for="remember" class="ml-2 text-sm text-white/80 cursor-pointer">Remember me for 30 days</label>
                </div>

                <button type="submit" id="submit-btn" class="w-full bg-primary hover:bg-primaryDark text-white font-bold py-3 px-4 rounded-xl shadow-lg transition-transform hover:-translate-y-0.5 mt-2 flex items-center justify-center gap-2">
                    Sign In
                </button>
            </form>

            <div class="mt-8 relative flex items-center justify-center">
                <div class="border-t border-white/20 absolute w-full"></div>
                <span class="bg-transparent px-3 text-white/60 text-sm relative z-10 glass rounded-full py-0.5">Or continue with</span>
            </div>

            <div class="mt-6 grid grid-cols-2 gap-4">
                <button class="flex items-center justify-center gap-2 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-white font-medium transition-colors">
                    <i class="fa-brands fa-google text-red-400"></i> Google
                </button>
                <button class="flex items-center justify-center gap-2 py-2.5 bg-white/10 hover:bg-white/20 border border-white/20 rounded-xl text-white font-medium transition-colors">
                    <i class="fa-brands fa-facebook text-blue-400"></i> Facebook
                </button>
            </div>

            <p class="mt-8 text-center text-sm text-white/80">
                Don't have an account? <a href="signup.html" class="text-primary hover:text-green-300 font-bold hover:underline">Sign up now</a>
            </p>
        </div>
    </div>

    <!-- API Client & Page Logic -->
    <script src="assets/js/api.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submit-btn');
            const errBanner = document.getElementById('error-message');
            
            // Collect fields
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            
            // Reset UI states
            errBanner.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Authenticating...';
            
            try {
                const response = await API.request('POST', '/auth/login', { email, password });
                
                // Show success feedback & redirect
                submitBtn.innerHTML = '<i class="fa-solid fa-check"></i> Welcome Back! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'dashboard/index.html';
                }, 800);
            } catch (err) {
                // Show errors
                errBanner.textContent = err.message || 'Invalid credentials. Please verify and try again.';
                errBanner.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign In';
            }
        });
    </script>
</body>
</html>
