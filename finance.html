<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance | Smart Kissan AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { primary: '#16a34a', darkGreen: '#14532d', earth: '#d97706', darkBg: '#0f172a' } } } }
    </script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-inter overflow-x-hidden">

    <aside id="sidebar" class="fixed top-0 left-0 z-40 w-64 h-screen transition-transform transform bg-white border-r border-gray-200 lg:translate-x-0">
        <!-- Sidebar content -->
        <div class="h-full px-3 py-4 overflow-y-auto bg-white flex flex-col">
            <a href="../index.html" class="flex items-center gap-2 mb-8 pl-2 mt-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-br from-primary to-earth flex items-center justify-center text-white"><i class="fa-solid fa-leaf text-sm"></i></div>
                <span class="font-outfit font-bold text-xl text-darkGreen">Smart Kissan</span>
            </a>
            <ul class="space-y-2 font-medium flex-1">
                <li><a href="index.html" class="flex items-center p-3 text-slate-600 rounded-lg hover:bg-slate-100 hover:text-primary transition-colors"><i class="fa-solid fa-chart-pie w-6"></i><span class="ml-3">Overview</span></a></li>
                <li><a href="finance.html" class="flex items-center p-3 text-primary rounded-lg bg-green-50"><i class="fa-solid fa-wallet w-6"></i><span class="ml-3">Finance</span></a></li>
                <!-- Other links -->
            </ul>
        </div>
    </aside>

    <div id="main-content" class="p-4 lg:ml-64 transition-all duration-300">
        <nav class="bg-white border border-gray-200 rounded-2xl px-4 py-3 flex justify-between items-center mb-6 shadow-sm">
            <h2 class="text-xl font-bold text-slate-800">Financial Analytics</h2>
            <button class="bg-primary hover:bg-primaryDark text-white px-4 py-2 rounded-lg font-semibold transition flex items-center gap-2 text-sm shadow-sm">
                <i class="fa-solid fa-plus"></i> Add Expense
            </button>
        </nav>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm border-l-4 border-l-green-500">
                <p class="text-sm font-medium text-slate-500 mb-1">Total Income (YTD)</p>
                <h3 class="text-3xl font-bold text-slate-800">₨ 850,000</h3>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm border-l-4 border-l-red-500">
                <p class="text-sm font-medium text-slate-500 mb-1">Total Expenses (YTD)</p>
                <h3 class="text-3xl font-bold text-slate-800">₨ 320,000</h3>
            </div>
            <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm border-l-4 border-l-blue-500">
                <p class="text-sm font-medium text-slate-500 mb-1">Net Profit</p>
                <h3 class="text-3xl font-bold text-primary">₨ 530,000</h3>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 border border-gray-100 shadow-sm">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Recent Transactions</h3>
            <div class="space-y-3">
                <div class="flex justify-between items-center p-3 hover:bg-slate-50 rounded-lg border border-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-red-100 text-red-500 flex items-center justify-center"><i class="fa-solid fa-arrow-up-right-from-square"></i></div>
                        <div>
                            <p class="font-bold text-slate-800">DAP Fertilizer Purchase</p>
                            <p class="text-xs text-slate-500">12 May, 2026</p>
                        </div>
                    </div>
                    <span class="font-bold text-red-500">-₨ 24,000</span>
                </div>
                <div class="flex justify-between items-center p-3 hover:bg-slate-50 rounded-lg border border-gray-50">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-green-100 text-green-500 flex items-center justify-center"><i class="fa-solid fa-arrow-down-left-from-square"></i></div>
                        <div>
                            <p class="font-bold text-slate-800">Sold Wheat Harvest</p>
                            <p class="text-xs text-slate-500">01 May, 2026</p>
                        </div>
                    </div>
                    <span class="font-bold text-green-500">+₨ 450,000</span>
                </div>
            </div>
        </div>
    </div>
    <script src="../assets/js/dashboard.js"></script>
</body>
</html>
